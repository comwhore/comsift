name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build plugin
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Package release zip
        run: |
          mkdir -p comsift
          cp main.js manifest.json styles.css comsift/
          zip -r comsift.zip comsift

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            comsift.zip
          generate_release_notes: true
