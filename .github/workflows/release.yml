name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build plugin
        run: |
          test -s "release-notes/$GITHUB_REF_NAME.md"
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Package release zip
        run: |
          mkdir -p comsift
          cp main.js manifest.json styles.css comsift/
          zip -r comsift.zip comsift

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            main.js
            manifest.json
            styles.css
            comsift.zip
          body_path: release-notes/${{ github.ref_name }}.md
      - name: Publish release after assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > uploaded-assets.txt
          printf '%s\n' main.js manifest.json styles.css comsift.zip | sort > expected-assets.txt
          diff -u expected-assets.txt uploaded-assets.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false
